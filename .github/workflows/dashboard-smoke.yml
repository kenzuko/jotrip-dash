name: Dashboard Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ops-data.js
          node --check ops-extended.js
          node --check ops-actions.js
          node --check command-v3.js
          node --check login.js
          node --check review-v4.js
          node --check config.js
      - name: Check required static assets
        run: |
          test -s index.html
          test -s login.html
          test -s review.html
          test -s styles.css
          test -s ops-extended.css
          test -s command-v3.css
          test -s login.css
          test -s review-v4.css
          test -s command-v3.js
          test -s login.js
          test -s review-v4.js
          test -s brand-logo.svg
          grep -q '^dash.openphuquoc.com$' CNAME
          grep -q 'Weather & Marine' index.html
          grep -q 'Airport Live' index.html
          grep -q 'command-v3.js' config.js
          grep -q 'Supabase Auth' login.html
          grep -q '24 màn hình' review.html
          grep -q "'field'" review-v4.js
